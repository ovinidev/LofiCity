<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#121041">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>LoFi City</title>
  <meta name="description" content="Cidades lo-fi em pixel art que seguem o horário e o clima reais, com rádio.">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32-v1.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16-v1.png">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-v1.png">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen&display=swap" media="print" onload="this.media='all'">
</head>
<body>
  <canvas id="view" aria-label="Animação em pixel art de uma cidade lo-fi que segue o horário e o clima reais"></canvas>
  <div id="bubbles" aria-live="polite"></div>

  <div class="hud ui">
    <button id="city" class="city" type="button" aria-haspopup="dialog" title="Trocar cidade no mapa (T)"><span class="sr">Cidade: </span><span class="name"></span><svg class="pin-ico" viewBox="0 0 8 8" aria-hidden="true"><path d="M2 0h4v1h1v4h-1v1h-1v2h-2v-2h-1v-1h-1v-4h1zM3 2h2v2h-2z" fill="currentColor" fill-rule="evenodd"/></svg></button>
    <span class="clock"><span id="clock">--:--</span><span class="temp" id="temp"></span></span>
    <span class="sub" id="date"></span>
    <span class="sub"><span class="live" id="live" hidden title="Clima via Open-Meteo">● ao vivo</span> <span id="wx"></span></span>
    <span class="sub" id="season"></span>
    <span class="hint" id="hint">toque nas coisas que se mexem · R rádio</span>
  </div>

  <div class="radio" id="radio"></div>

  <div class="bar ui" role="toolbar" aria-label="Controles da cena">
    <button id="b-exit" hidden title="Sair do ônibus (Esc)">Sair do ônibus</button>
    <button id="b-sound" aria-pressed="false" title="Som ambiente: chuva, vento, grilos (M)">Ambiente</button>
    <button id="b-crt" aria-pressed="false" title="Efeito CRT (C)">CRT</button>
    <button id="b-scene" title="Próximo cenário (S)">Cenário</button>
    <button id="b-full" title="Tela cheia (Enter)">Tela cheia</button>
  </div>

  <button id="b-hud" class="eye" type="button" aria-pressed="false" aria-label="Ocultar painel" title="Ocultar painel (H)">
    <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square">
      <path d="M2 12s3.6-6 10-6 10 6 10 6-3.6 6-10 6S2 12 2 12z"/>
      <circle cx="12" cy="12" r="2.6"/>
      <path class="slash" d="M4 20 20 4"/>
    </svg>
  </button>

  <!-- share: always on screen under the eye (works with the HUD hidden); copies a link or saves a card, never posts -->
  <div class="share" id="share">
    <button id="b-share" class="share-btn" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="share-menu" aria-label="Compartilhar" title="Compartilhar">
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square">
        <circle cx="18" cy="5" r="2.6"/><circle cx="6" cy="12" r="2.6"/><circle cx="18" cy="19" r="2.6"/>
        <path d="M8.3 10.8 15.7 6.3M8.3 13.2l7.4 4.5"/>
      </svg>
    </button>
    <div class="share-menu" id="share-menu" role="menu" aria-label="Compartilhar" hidden>
      <button type="button" role="menuitem" id="b-copy">Copiar link</button>
      <button type="button" role="menuitem" id="b-card">Baixar card</button>
    </div>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <a class="credit" href="https://github.com/ovinidev" target="_blank" rel="noopener" title="GitHub de ovinidev">@ovinidev</a>

  <div id="rotate" role="dialog" aria-modal="true" aria-labelledby="rotate-t">
    <svg class="phone" viewBox="0 0 64 64" aria-hidden="true">
      <rect x="20" y="8" width="24" height="44" rx="4" fill="none" stroke="currentColor" stroke-width="3"/>
      <rect x="29" y="46" width="6" height="2" fill="currentColor"/>
    </svg>
    <p id="rotate-t" class="rt-title">Gire o celular</p>
    <p class="rt-sub">A cidade cabe melhor na horizontal.</p>
    <button id="rotate-ok" type="button">Continuar na vertical</button>
  </div>

  <div id="debug" hidden></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
